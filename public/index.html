:root{--bg:#0A1020;--bg2:#0D1B2A;--surface:#121A2E;--paper:#F7F3EA;--paper2:#FFFFFF;--ink:#0B1B36;--ink2:#152A4A;--mute:#5A6475;--mute-d:#8A94A8;--rule:#E6DFD2;--rule-d:rgba(230,223,210,.14);--gold:#B8935A;--gold-d:#C9A24B;--ivory:#F3ECDC;--red:#B4232C;--navy:#0D1B2A;--sky:#6FA8DC;--green:#0E7C3A;--teal:#1AA7B5;--warn:#B8843D;--danger:#8F3E3E}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ivory);font-family:Heebo,system-ui,sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}

a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}

.meta{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute-d)}
.dot{color:var(--gold-d)}
.top{border-bottom:1px solid var(--rule-d)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none}
.brand .wm{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:.01em}
.brand .wm i{font-style:normal;color:var(--gold-d)}
.firm{font-size:12.5px;color:var(--mute-d);text-decoration:none;border-bottom:1px solid var(--rule-d);padding-bottom:1px;white-space:nowrap}
.firm:hover{color:var(--ivory)}
@media (max-width:480px){.brand .wm{font-size:15px}.firm{display:none}}
.lang{display:flex;align-items:center;border:1px solid var(--rule-d);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{font:inherit;font-size:12.5px;padding:5px 12px;background:transparent;color:var(--mute-d);border:0;cursor:pointer}
.lang button.on{background:var(--ivory);color:var(--bg)}
.hero .wrap{padding:26px 20px 18px}

body[data-lang="ar"] h1{font-family:Cairo,sans-serif;font-weight:700;letter-spacing:0}
.sub{max-width:900px;font-weight:300;font-size:clamp(15px,1.5vw,18px);color:#CCC3B0;margin:0}

.status .wrap::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:10px;padding:10px 18px;border-inline-end:1px solid var(--rule-d);white-space:nowrap;font-size:13.5px}
.st:first-child{padding-inline-start:0}
.st .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute-d)}
.st .v{color:#fff;font-weight:500}
.live{display:inline-flex;align-items:center;gap:7px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.12em}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.ticker{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--rule)}
.ticker .wrap{display:flex;align-items:center;padding:0;overflow:hidden}
.ticker .lbl{background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.14em;padding:9px 14px;flex:0 0 auto}
.ticker .track-wrap{flex:1;overflow:hidden;position:relative;height:36px}
.ticker .track{position:absolute;top:0;inset-inline-start:0;display:inline-flex;gap:56px;align-items:center;height:36px;white-space:nowrap;font-size:14px;padding-inline:20px;animation:tick var(--tick-dur,70s) linear infinite}
.ticker .track:hover{animation-play-state:paused}
.ticker .track span b{color:var(--gold);font-weight:700;margin-inline-end:8px;font-family:"JetBrains Mono",monospace;font-size:12px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:22px 0}

.panel{background:var(--paper);color:var(--ink);border-radius:8px;padding:20px 22px}

.panel h2::after{content:"";flex:1;height:1px;background:var(--rule)}

.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:disabled{color:#A8A29E;cursor:default}
.chart{width:100%;height:auto;display:block}
.boardnote{font-size:13px;color:var(--mute);margin:10px 0 0;line-height:1.5}
.parties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:18px;border-top:1px solid var(--rule)}

.party .n{display:flex;align-items:center;gap:9px;font-size:14.5px}
.party .n i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}
.party .s{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:24px;line-height:1}
.party .sd{font-size:12px;color:var(--mute);margin-inline-start:6px;font-family:"JetBrains Mono",monospace}
.modelline{margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.04em;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 18px}
.modelline b{color:var(--ink);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}

.kpi{background:var(--surface);border:1px solid var(--rule-d);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12.5px;color:var(--mute-d);line-height:1.35}
.kpi .v{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:clamp(30px,3.2vw,40px);line-height:1;color:#fff;margin:4px 0 2px}.kpi .v.na{font-family:Heebo,sans-serif;font-weight:400;font-size:15px;color:var(--mute-d);margin:6px 0 4px}
.kpi .v small{font-family:Heebo,sans-serif;font-weight:400;font-size:11.5px;color:var(--mute-d);margin-inline-start:8px}
.kpi .c{font-size:11.5px;color:var(--mute-d);display:flex;flex-wrap:wrap;gap:2px 10px}
.kpi .c b{color:var(--ivory);font-weight:500}

th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}

let LANG = localStorage.getItem("lang") || "he", DATA = null, VIEW = "final";
const t = k => (S[LANG][k] ?? S.he[k] ?? k);
const fmt = n => n == null ? "—" : Number(n).toLocaleString("en-US");
const pct = n => n == null ? "—" : Number(n).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setLang(l){ LANG = l; localStorage.setItem("lang", l); document.documentElement.lang = l; document.body.dataset.lang = l;
  document.querySelectorAll("[data-lang-btn]").forEach(b => b.classList.toggle("on", b.dataset.langBtn === l));
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  if (DATA) render(); }
document.querySelectorAll("[data-lang-btn]").forEach(b => b.onclick = () => setLang(b.dataset.langBtn));
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { VIEW = b.dataset.view; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); });
const DATA_URLS = ["https://raw.githubusercontent.com/Khaledaun/khaledaun.com/elections-2026/public/data.json", "data.json"];
async function load(){ for (const u of DATA_URLS){ try{ const r = await fetch(u + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) continue; const j = await r.json(); if(!DATA || (j.generated_at||"") >= (DATA.generated_at||"")){ DATA = j; render(); } return; }catch(e){ console.warn("data source failed", u, e); } } }
setInterval(load, 5*60*1000); setInterval(tick, 1000);
function tick(){ if(!DATA) return; const el = document.getElementById("st-next");
  if(!DATA.next_update){ el.textContent = t("next_none"); return; }
  const d = new Date(DATA.next_update) - new Date(); if (d <= 0){ el.textContent = "00:00:00"; return; }
  const h = Math.floor(d/3.6e6), m = Math.floor(d%3.6e6/6e4), s = Math.floor(d%6e4/1e3);
  el.textContent = [h,m,s].map(x => String(x).padStart(2,"0")).join(":"); }
function render(){
  const D = DATA, g = D.groups;
  document.getElementById("st-phase").textContent = D.phase === "waiting" ? t("phase_waiting") : (D.phase === "results" ? t("phase_results") : t("phase_turnout"));
  document.getElementById("st-hour").textContent = D.phase === "waiting" ? "—" : D.update_hour;
  document.getElementById("st-gen").textContent = new Date(D.generated_at).toLocaleTimeString(LANG === "he" ? "he-IL" : "ar-EG-u-nu-latn", {hour:"2-digit", minute:"2-digit"});
  document.getElementById("st-measure").textContent = fmt(D.model.measure);
  tick();
  const order = [["national","t_national"],["arab_general","t_arab_general"],["arab125","t_arab125"],["right","t_right"],["left","t_left"]];
  document.getElementById("tiles").innerHTML = order.map(([k,lbl]) => { const x = g[k]; const now = x.turnout_now;
    const idx = (now && x.turnout_2022_same_hour) ? now / x.turnout_2022_same_hour : null;
    const tag = idx ? `<span class="tag ${idx>=1?"up":"down"}">${idx>=1?"▲":"▼"} ${Math.round(Math.abs(idx-1)*100)}% ${t("pace")}</span>` : "";
    const src = x.source==="override" ? t("src_override")+(x.override&&x.override.src?" · "+esc(x.override.src):"") : (now==null ? t("nodata") : t("src_file"));
    return `<div class="kpi"><div class="l">${t(lbl)}${k==="arab125"?`<br><span style="font-size:11px">${t("t_arab125_s")}</span>`:""}</div><div class="v ${now==null?"na":""}">${now==null?src:pct(now)+`<small>${src}</small>`}</div><div class="c"><span>${t("same22")} <b>${pct(x.turnout_2022_same_hour)}</b></span><span>${t("fin22")} <b>${pct(x.turnout_2022_final)}</b></span><span>${t("proj")} <b>${x.projected_final==null?"—":pct(x.projected_final)}</b></span>${tag}</div></div>`; }).join("");
  const curT = D.model.inputs.arab_turnout;
  document.getElementById("ladder").innerHTML = (D.model.ladder||[]).map(r => `<tr class="${Math.abs(r.turnout-curT)<1.6?"cur":""}"><td class="num">${r.turnout}%</td><td class="num">${r.arab}</td><td class="num">${r.jl}</td><td class="num">${r.raam}</td><td class="num">${fmt(r.measure)}</td></tr>`).join("");
  const M = (VIEW === "now" && D.model_now) ? D.model_now : D.model;
  document.querySelector('#tabs button[data-view="now"]').disabled = !D.model_now;
  drawChart(M);
  const blocOf = p => ["Likud","Shas","UTJ","RZ-Zehut","Otzma"].includes(p)?"var(--navy)":(["Yashar","Beyachad","Democrats","YB"].includes(p)?"var(--sky)":(p==="Ra'am"?"var(--green)":(p==="Joint List"?"var(--teal)":"#B9B3A6")));
  const ord = Object.keys(M.parties).sort((a,b) => (M.parties[b].seats - M.parties[a].seats) || (M.parties[b].mean - M.parties[a].mean));
  document.getElementById("parties").innerHTML = ord.map(p => { const x = M.parties[p]; return `<div class="party"><span class="n"><i style="background:${blocOf(p)}"></i>${t("p_"+p)}</span><span><span class="s">${x.seats}</span><span class="sd">±${x.sd}</span></span></div>`; }).join("");
  const I = M.inputs;
  document.getElementById("meta").innerHTML = `<span>${t("measure")} <b>${fmt(M.measure)}</b></span><span>${t("arab_votes")} <b>${fmt(M.arab_votes)}</b> (${t("quot")} ${M.arab_quotient})</span><span>${t("arab_in")} <b>${I.arab_turnout}%</b></span><span>${t("other_in")} <b>${I.other_turnout}%</b></span><span>${t("capture")} <b>${Math.round(I.capture*100)}%</b></span><span>${t("ext")} <b>${fmt(I.external_votes)}</b></span><span>${t(M.basis==="priors"?"basis_priors":(M.basis==="snapshot"?"basis_snapshot":"basis_file"))}</span>`;
  document.getElementById("model-note").textContent = (VIEW === "now" ? t("now_expl") : t("final_expl")) + " " + ((D.notes||{})[LANG] || "");
  const news = (D.news||[]).slice().sort((a,b)=> (b.t||"").localeCompare(a.t||""));
  document.getElementById("news").innerHTML = news.map(n => `<li><div class="t"><span>${fmtTime(n.t)}</span>${n.impact?`<span class="chip gold">${t("impact")} ±${n.impact}%</span>`:""}</div><div>${esc(n[LANG]||n.he)}</div><div class="src"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.src)}</a></div></li>`).join("");
  const tk = document.getElementById("ticker"); const tnews = news.slice(0,8);
  const items = tnews.map(n => `<span><b>${fmtTime(n.t, true)}</b>${esc(n[LANG]||n.he)}</span>`).join("");
  tk.innerHTML = items + items;
  tk.style.setProperty("--tick-dur", Math.max(40, tnews.reduce((a,n)=>a+(n[LANG]||n.he).length,0)/5) + "s");
  document.getElementById("events").innerHTML = (D.events||[]).map(e => `<tr><td><b>${esc(e[LANG]||e.he)}</b></td><td><a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:var(--ink2)">${esc(e.src)}</a></td><td>${esc(e["why_"+LANG]||e.why_he)}</td><td><span class="chip ${e.status==="final"?"":"gold"}">${t(e.status==="final"?"st_final":"st_updating")}</span></td><td class="num">${esc(e.impact)}</td></tr>`).join("");
  renderLocs();
  document.getElementById("credits").innerHTML = (D.credits||[]).map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c[LANG]||c.he)}</a></li>`).join("");
}
function fmtTime(s, short){ if(!s) return ""; const d = new Date(s); if (isNaN(d)) return esc(s); return d.toLocaleString(LANG==="he"?"he-IL":"ar-EG-u-nu-latn", short?{hour:"2-digit",minute:"2-digit"}:{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function renderLocs(){ const q = (document.getElementById("loc-search").value||"").trim(); const rows = (DATA.localities||[]).filter(r => !q || r.name.includes(q));
  document.getElementById("locs").innerHTML = rows.length ? rows.slice(0,400).map(r => `<tr><td>${esc(r.name)}</td><td>${t("g_"+r.group)}</td><td class="num">${fmt(r.eligible)}</td><td class="num">${pct(r.turnout_now)}</td><td class="num">${pct(r.turnout_2022)}</td><td class="num">${r.index_vs_2022_pace==null?"—":r.index_vs_2022_pace.toFixed(2)}</td></tr>`).join("") : `<tr><td colspan="6" class="empty">${t("loc_empty")}</td></tr>`; }
document.getElementById("loc-search").addEventListener("input", renderLocs);
function drawChart(M){
  const W = 800, H = 400, base = 330, top = 96, maxSeats = 64, scale = (base - top) / maxSeats;
  const items = [
    {label:t("bloc_net"), lead:t("lead_net"), color:"#0D1B2A", v:M.blocs.netanyahu},
    {label:t("bloc_chg"), lead:t("lead_chg"), color:"#6FA8DC", v:M.blocs.eisenkot},
    {label:t("raam"), lead:t("lead_raam"), color:"#0E7C3A", v:M.parties["Ra'am"]},
    {label:t("jl"), lead:t("lead_jl"), color:"#1AA7B5", v:M.parties["Joint List"]},
  ];
  const n = items.length, slot = W / n, bw = Math.min(130, slot * 0.56);
  const y61 = base - 61 * scale;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t("seats")}" direction="ltr" style="direction:ltr">`;
  s += `<line x1="0" x2="${W}" y1="${y61}" y2="${y61}" stroke="#B8935A" stroke-width="1" stroke-dasharray="3 5"/>`;
  s += `<text x="${W-4}" y="${y61-7}" font-size="11" fill="#B8935A" text-anchor="end" font-family="JetBrains Mono" letter-spacing="1">${t("majority")}</text>`;
  s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#0B1B36" stroke-width="1.5"/>`;
  items.forEach((it, i) => {
    const seats = it.v.seats ?? 0, mean = it.v.mean ?? seats, sd = it.v.sd ?? 0;
    const cx = (n - 1 - i) * slot + slot / 2, x = cx - bw / 2, h = Math.max(seats * scale, 3), y = base - h;
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${it.color}"/>`;
    if (sd > 0) { const yl = base - (mean + sd) * scale, yh = base - (mean - sd) * scale, wx = x + bw + 14;
      s += `<line x1="${wx}" x2="${wx}" y1="${yl}" y2="${yh}" stroke="#0B1B36" stroke-width="1"/><line x1="${wx-4}" x2="${wx+4}" y1="${yl}" y2="${yl}" stroke="#0B1B36" stroke-width="1"/><line x1="${wx-4}" x2="${wx+4}" y1="${yh}" y2="${yh}" stroke="#0B1B36" stroke-width="1"/>`;
      s += `<text x="${wx+8}" y="${(yl+yh)/2+4}" font-size="10.5" fill="#5A6475" font-family="JetBrains Mono" text-anchor="start">±${sd}</text>`; }
    s += `<text x="${cx}" y="${y-14}" text-anchor="middle" font-family="'Frank Ruhl Libre',serif" font-weight="900" font-size="48" fill="#0B1B36">${seats}</text>`;
    s += `<text x="${cx}" y="${base+24}" text-anchor="middle" font-size="14" font-weight="700" fill="#0B1B36" font-family="Heebo, Cairo, sans-serif">${esc(it.label)}</text>`;
    s += `<text x="${cx}" y="${base+44}" text-anchor="middle" font-size="12" fill="#5A6475" font-family="Heebo, Cairo, sans-serif">${esc(it.lead)}</text>`;
  });
  s += `</svg>`;
  document.getElementById("chart").innerHTML = s;
}
